services:
  db:
    image: postgres:16-alpine
    container_name: sportapp-db
    restart: unless-stopped
    env_file:
      - .env
    ports:
      # Accessible uniquement depuis ton PC, pas depuis le réseau
      - "127.0.0.1:5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  db_data: